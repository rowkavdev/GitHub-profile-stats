name: Uptime probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check service availability
        run: |
          curl --fail --silent --show-error --retry 2 https://ghstats.dev/api/status -o /tmp/status.json
          node scripts/check-uptime.mjs < /tmp/status.json
