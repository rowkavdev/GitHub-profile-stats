name: Uptime probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect and check service availability
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not configured" >&2; exit 1; }
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $CRON_SECRET" https://ghstats.dev/api/status/collect -o /tmp/status.json
          node scripts/check-uptime.mjs < /tmp/status.json
