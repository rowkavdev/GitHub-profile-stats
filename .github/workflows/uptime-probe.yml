name: Uptime probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check service availability
        run: |
          curl --fail --silent --show-error --retry 2 https://ghstats.dev/api/status -o /tmp/status.json
          node scripts/check-uptime.mjs < /tmp/status.json
