name: Pull request labels
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = ['size:XS','size:S','size:M','size:L','size:XL'];
            const colors = ['0e8a16','1d76db','fbca04','d93f0b','b60205'];
            for (let i=0;i<labels.length;i++) { try { await github.rest.issues.getLabel({...context.repo,name:labels[i]}); } catch { await github.rest.issues.createLabel({...context.repo,name:labels[i],color:colors[i]}); } }
            const pr=context.payload.pull_request, lines=pr.additions+pr.deletions;
            const size=lines<=10?labels[0]:lines<=50?labels[1]:lines<=200?labels[2]:lines<=500?labels[3]:labels[4];
            const current=(await github.rest.issues.listLabelsOnIssue({...context.repo,issue_number:pr.number})).data.map(x=>x.name);
            for (const name of current.filter(x=>labels.includes(x)&&x!==size)) await github.rest.issues.removeLabel({...context.repo,issue_number:pr.number,name});
            if (!current.includes(size)) await github.rest.issues.addLabels({...context.repo,issue_number:pr.number,labels:[size]});
